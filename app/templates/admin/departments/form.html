{% extends "admin/dashboard.html" %}

{% block title %}{{ 'Edit' if department else 'Add' }} Department — Admin{% endblock %}

{% block content %}
<div class="dashboard-header mb-4">
    <a href="{{ url_for('admin_departments.index') }}" class="btn btn-sm btn-outline-secondary mb-3">
        <i class="bi bi-arrow-left"></i> Back to Departments
    </a>
    <h2><i class="bi bi-building me-2"></i> {{ 'Edit' if department else 'Add' }} Department</h2>
</div>

<div class="card bg-card border-0 max-w-600">
    <div class="card-body p-4">
        <form method="POST">
            <div class="mb-3">
                <label for="department_code" class="form-label text-muted">Department Code</label>
                <input type="text" class="form-control bg-dark text-light border-secondary" id="department_code" name="department_code" value="{{ department.department_code if department else '' }}" required placeholder="e.g. CSE">
            </div>
            
            <div class="mb-4">
                <label for="department_name" class="form-label text-muted">Department Name</label>
                <input type="text" class="form-control bg-dark text-light border-secondary" id="department_name" name="department_name" value="{{ department.department_name if department else '' }}" required placeholder="e.g. Computer Science and Engineering">
            </div>
            
            <div class="d-flex justify-content-end">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save me-1"></i> Save Department
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
