{% extends "admin/dashboard.html" %}

{% block title %}{{ 'Edit' if subject else 'Add' }} Subject — Admin{% endblock %}

{% block content %}
<div class="dashboard-header mb-4">
    <a href="{{ url_for('admin_subjects.index') }}" class="btn btn-sm btn-outline-secondary mb-3">
        <i class="bi bi-arrow-left"></i> Back to Subjects
    </a>
    <h2><i class="bi bi-book me-2"></i> {{ 'Edit' if subject else 'Add' }} Subject</h2>
</div>

<div class="card bg-card border-0 max-w-600">
    <div class="card-body p-4">
        <form method="POST">
            <div class="mb-3">
                <label for="subject_code" class="form-label text-muted">Subject Code</label>
                <input type="text" class="form-control bg-dark text-light border-secondary" id="subject_code" name="subject_code" value="{{ subject.subject_code if subject else '' }}" required placeholder="e.g. CS101">
            </div>
            
            <div class="mb-3">
                <label for="subject_name" class="form-label text-muted">Subject Name</label>
                <input type="text" class="form-control bg-dark text-light border-secondary" id="subject_name" name="subject_name" value="{{ subject.subject_name if subject else '' }}" required placeholder="e.g. Introduction to Programming">
            </div>
            
            <div class="mb-4">
                <label for="credits" class="form-label text-muted">Credits</label>
                <input type="number" class="form-control bg-dark text-light border-secondary" id="credits" name="credits" value="{{ subject.credits if subject else 3 }}" required min="1" max="10">
            </div>
            
            <div class="d-flex justify-content-end">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save me-1"></i> Save Subject
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
